<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Survey Perokok</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="heading">
            <div class="accent"></div>
            <h1 style="padding: 0 40px;">Form Survey Perokok</h1>
            <p style="padding: 0 40px;">Isi form dibawah ini dengan jawaban yang sebenarnya.</p>
            <div class="email">
                <p><b style="color: darkslategray; font-size: small;">example@gmail.com</b> <span style="color: deepskyblue;">Switch Account</span></p>
                <p style="color: gray;">cloud</p>
            </div>
            <p style="color: red; padding: 0 40px; font-size: small;">* Indicates required question</p>
        </div>
    </header>
    <div class="container">
        <form action="data.html">
            <div class="short">
                <label for="nama">Siapa nama anda? <span class="red">*</span></label>
                <input type="text" name="nama" id="nama" placeholder="Your answer">
            </div>
            <div class="short">
                <label for="umur">Berapa umur anda? <span class="red">*</span></label>
                <input type="number" name="umur" id="umur" placeholder="Your answer">
            </div>
            <div class="radio">
                <label for="m">Apa jenis kelamin anda? <span class="red">*</span></label>
                <div class="choice">
                    <input type="radio" name="gender" value="m" id="m">
                    <label for="m">Laki-laki</label>    
                </div>
                <div class="choice">
                    <input type="radio" name="gender" value="f" id="f">
                    <label for="f">Perempuan</label>
                </div>
            </div>
            <div class="radio">
                <label for="y">Apakah anda perokok? <span class="red">*</span></label>
                <div class="choice">
                    <input type="radio" name="smoke" value="y" id="y">
                    <label for="y">Ya</label>
                </div>
                <div class="choice">
                    <input type="radio" name="smoke" value="n" id="n">
                    <label for="n">Tidak</label>
                </div>
            </div>
            <div class="multi">
                <label for="gg">Jika anda perokok, rokok apa yang pernah anda coba? <span class="red">*</span></label>
                <div class="choice">
                    <input type="checkbox" name="cigs" id="gg">
                    <label for="gg">Gudang Garam Filter</label>
                </div>
                <div class="choice">
                    <input type="checkbox" name="cigs" id="ls">
                    <label for="ls">Lucky Strike</label>
                </div>
                <div class="choice">
                    <input type="checkbox" name="cigs" id="mb">
                    <label for="mb">Marlboro</label>
                </div>
                <div class="choice">
                    <input type="checkbox" name="cigs" id="es">
                    <label for="es">Esse</label>
                </div>
            </div>
            <div class="submit-reset">
                <button type="submit">Submit</button>
                <button type="reset">Clear form</button>
            </div>
        </form>
    </div>
    <div>
        <a href="data.html">Data Responden Sebelumnya</a>
    </div>
</body>
</html>
